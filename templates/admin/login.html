<!DOCTYPE HTML>
<html>
<head>
  <title>Admin — Log in</title>
  {% include "head.html" %}
</head>
<body>
  <div id="main">
    <div id="site_content">
      <div id="content" style="background-color:white; color:black; padding: 20px">
        <h1>Admin log in</h1>
        <p><a href="/">Main site</a></p>
        {% if error %}
        <p style="color: #b91c1c;">{{ error }}</p>
        {% endif %}
        <form method="post" action="/admin/login" style="max-width: 24em;">
          <input type="hidden" name="next" value="{{ next_url }}" />
          <p>
            <label>Email<br />
              <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" style="width: 100%;" />
            </label>
          </p>
          <p>
            <label>Password<br />
              <input type="password" name="password" required autocomplete="current-password" style="width: 100%;" />
            </label>
          </p>
          <p>
            <button type="submit">Log in</button>
          </p>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
