[project]
name = "ekcx-web"
version = "0.1.0"
description = "East Kent Cyclocross website"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.26.0",
    "gunicorn>=21.2.0",
    "jinja2>=3.1.3",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.2.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "polyfactory>=2.18.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
]
